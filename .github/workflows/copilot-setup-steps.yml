name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - pyproject.toml
      - poetry.lock
      - docs/requirements.txt

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install "poetry==2.5.1"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry
          cache-dependency-path: |
            pyproject.toml
            poetry.lock
            docs/requirements.txt

      - name: Install development dependencies and optional extras
        run: |
          poetry env use python
          poetry install --with dev --all-extras --no-interaction

      - name: Install documentation dependencies
        run: |
          poetry run python -m pip freeze --exclude-editable > "$RUNNER_TEMP/copilot-constraints.txt"
          poetry run python -m pip install --constraint "$RUNNER_TEMP/copilot-constraints.txt" --requirement docs/requirements.txt
          poetry install --only-root --no-interaction

      - name: Verify environment
        run: |
          poetry run python -m pip check
          poetry run python -c "import nisystemlink.clients; import pyarrow; import sphinx"
          poetry run pytest --version
          poetry run sphinx-build --version
